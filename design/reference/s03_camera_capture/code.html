y{width:100%;margin:0;padding:0;background-color:#e8eaf0;color:#2e3040;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}.neo-raised{box-shadow:6px 6px 12px rgba(0,0,0,0.08), -6px -6px 12px rgba(255,255,255,0.6);}.neo-inset{box-shadow:inset 4px 4px 8px rgba(0,0,0,0.06), inset -4px -4px 8px rgba(255,255,255,0.5);}}::-webkit-scrollbar{display:none;}</style><style>

</head><body class="bg-surface font-body min-h-screen text-on-surface antialiased flex flex-col relative selection:bg-primary-fixed"><main class="flex-1 flex flex-col w-full bg-surface relative"><div class="flex flex-col w-full relative select-none overflow-hidden pb-6">

</svg>
</div>
<!-- Live Guidance Pill (Upper Third) -->
<div class="absolute top-20 z-20 flex flex-col items-center gap-1.5 px-4 pointer-events-none">
<div class="flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-inverse-surface/85 backdrop-blur-md shadow-md text-inverse-on-surface">

</div>
<span class="text-[10px] text-surface-container-highest tracking-tight opacity-90 drop-shadow">Shutter ready anytime (never blocked)</span>
</div>
<!-- Mode Badge Indicator (ID / Multi-page Front Cue) -->
<div class="absolute bottom-24 left-4 z-20 flex items-center gap-2 bg-surface/90 backdrop-blur-sm px-3 py-1.5 rounded-xl neo-raised text-on-surface">
<span class="material-symbols-outlined text-primary text-sm">badge</span>
<div class="flex flex-col">

</div>
<!-- Aspect Ratio Visual Anchor Indicator -->

<span>A4 Auto</span>

<!-- Back / Discard Sheet Trigger -->
<button aria-label="Cancel or Discard Draft" class="w-11 h-11 rounded-full bg-surface/90 neo-raised flex items-center justify-center text-on-surface active:neo-inset transition-transform active:scale-95" id="btn-back" type="button">
<span class="material-symbols-outlined text-xl">close</span>
</button>
<!-- Mode Selector Pill -->
<div class="flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-surface/90 neo-raised">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span class="text-xs font-semibold text-on-surface">Document Mode</span>
<span class="material-symbols-outlined text-xs text-on-surface-variant">expand_more</span>
</div>
<!-- Quick Action Cluster (Flash / Lens / Guidance) -->
<div class="flex items-center gap-2">
<button aria-label="Flash Toggle" class="w-10 h-10 rounded-full bg-surface/90 neo-raised flex items-center justify-center text-on-surface active:neo-inset transition-transform active:scale-95" id="btn-flash" type="button">
<span class="material-symbols-outlined text-lg" id="flash-icon">flash_auto</span>
</button>
<button aria-label="Detection Grid Toggle" class="w-10 h-10 rounded-full bg-surface/90 neo-raised flex items-center justify-center text-primary active:neo-inset transition-transform active:scale-95" id="btn-guidance" type="button">
<span class="material-symbols-outlined text-lg" style="font-variation-settings: 'FILL' 1;">view_in_ar</span>
</button>
</div>
</div>
</div>
<!-- Bottom Tactile Ergonomic Controls Panel -->
<div class="w-full px-4 pt-4 flex flex-col gap-4">
<!-- Lens & Auto-Capture Sub-Bar -->
<div class="w-full flex items-center justify-between px-2">
<!-- Lens Switching Pill (Neomorphic segment) -->
<div class="flex items-center bg-surface-container rounded-full p-1 neo-inset">
<button class="px-2.5 py-0.5 rounded-full text-xs font-semibold text-on-surface-variant transition-colors" id="lens-05" type="button">.5W</button>
<button class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-surface text-primary neo-raised transition-colors" id="lens-1x" type="button">1x</button>
</div>
<!-- Auto-capture Toggle Switch -->
<button class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-surface neo-raised active:neo-inset transition-all" id="auto-toggle" type="button">
<span class="text-xs font-semibold text-on-surface">Auto-Snapping</span>
<div class="w-8 h-4 rounded-full bg-primary-fixed flex items-center p-0.5 neo-inset">
<div class="w-3 h-3 rounded-full bg-primary shadow-sm translate-x-4 transition-transform" id="toggle-dot"></div>
</div>
</button>
</div>
<!-- Main Shutter & Workflow Actions Row -->
<div class="w-full flex items-center justify-between py-1">
<!-- Left: Stacked Batch Thumbnails & Counter -->
<div class="w-20 flex flex-col items-start">
<div class="relative w-13 h-13">
<!-- Stack card 1 (Bottom) -->
<div class="absolute -top-1 -right-1 w-11 h-11 rounded-lg bg-surface-variant neo-raised rotate-6"></div>
<!-- Stack card 2 (Middle) -->
<div class="absolute -top-0.5 -right-0.5 w-11 h-11 rounded-lg bg-surface-container-high neo-raised rotate-2"></div>
<!-- Stack card 3 (Active thumbnail preview) -->
<div class="relative w-11 h-11 rounded-lg overflow-hidden neo-raised bg-surface-container flex items-center justify-center">
<div class="w-full h-full bg-cover bg-center" data-alt="Miniature scan thumbnail of previous document page with invoice line items and receipt stamp, crisp high contrast lighting, clean paper border." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAtYBtFjX1XBRPwFCz2TzBka8thICQ9Y6JQPDWjT1fbQzHH1Ek-giaNwTtJzR0c265v8GQ--L7D4ZIN3LSzFE7SmM9_gRRlq6HKqB40u49JuOe-40FcV6FO315KkxVDIB4JIyKYDpQwIiGF5XS8LO3V725kXoXNCUd3HkLDE_r4gAQ4rQzics24mL6GbE6QHz6Xyju5TsT-JiV4nOw528osNxVokwc5mmjbneGlkm3ZJ1_tochz8-Xm')">
</div>
<!-- Count Pill Badge -->
<div class="absolute -top-1.5 -right-1.5 min-w-[18px] h-[18px] px-1 rounded-full bg-primary text-on-primary text-[10px] font-bold flex items-center justify-center shadow-sm">
              3
            </div>
</div>
</div>
<span class="text-[10px] text-on-surface-variant font-medium mt-1 truncate max-w-[76px]">3 Captures</span>
</div>
<!-- Center: Tactile Dual-Ring Shutter Button (72dp spec) -->
<div class="flex items-center justify-center">
<button aria-label="Capture page" class="relative w-[76px] h-[76px] rounded-full bg-surface neo-raised flex items-center justify-center p-1.5 transition-transform active:scale-95 active:neo-inset focus:outline-none" id="shutter-button" type="button">
<!-- Outer guidance ring -->
<div class="w-full h-full rounded-full flex items-center justify-center bg-surface neo-inset p-1">
<!-- Center physical trigger clay cylinder -->
<div class="w-full h-full rounded-full bg-surface neo-raised flex items-center justify-center text-primary transition-all" id="shutter-core">
<span class="material-symbols-outlined text-2xl font-light">photo_camera</span>
</div>
</div>
</button>
</div>
<!-- Right: Done Button (Proceeds to S04 Boundary Editor) -->
<div class="w-20 flex flex-col items-end">
<button class="h-11 px-3.5 rounded-full bg-surface neo-raised text-primary active:neo-inset transition-transform active:scale-95 flex items-center gap-1" id="btn-done" type="button">
<span class="text-xs font-semibold">Done</span>
<span class="material-symbols-outlined text-base font-semibold">arrow_forward</span>
</button>
<span class="text-[10px] text-on-surface-variant font-medium mt-1">Review (3)</span>
</div>
</div>
</div>
<!-- Discard / Save Draft Bottom Sheet Modal (Hidden by default) -->
<div class="fixed inset-0 z-50 bg-on-surface/40 backdrop-blur-xs hidden items-end justify-center p-4" id="discard-modal">
<div class="w-full max-w-sm rounded-xl bg-surface p-5 neo-raised flex flex-col gap-3">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface neo-inset flex items-center justify-center text-error">
<span class="material-symbols-outlined text-xl">warning</span>
</div>
<div class="flex flex-col">
<h3 class="text-sm font-semibold text-on-surface">Unsaved Scans</h3>
<p class="text-xs text-on-surface-variant">You have 3 captured pages in this session.</p>
</div>
</div>
<div class="grid grid-cols-2 gap-3 mt-2">
<button class="h-10 rounded-xl bg-surface neo-raised text-xs font-semibold text-error active:neo-inset transition-all" id="modal-discard" type="button">
          Discard All
        </button>
<button class="h-10 rounded-xl bg-surface neo-raised text-xs font-semibold text-primary active:neo-inset transition-all" id="modal-keep" type="button">
          Keep Drafting
        </button>
</div>
</div>
</div>
</div>
<script>
  (() => {
    // Shutter Tactile Click Simulation
    const shutter = document.getElementById('shutter-button');
    const shutterCore = document.getElementById('shutter-core');

    if (shutter && shutterCore) {
      shutter.addEventListener('click', () => {
        shutterCore.classList.remove('neo-raised');
        shutterCore.classList.add('neo-inset');
        setTimeout(() => {
          shutterCore.classList.remove('neo-inset');
          shutterCore.classList.add('neo-raised');
        }, 180);
      });
    }

    // Flash Cycle
    const flashBtn = document.getElementById('btn-flash');
    const flashIcon = document.getElementById('flash-icon');
    const flashStates = ['flash_auto', 'flash_on', 'flash_off'];
    let flashIdx = 0;

    if (flashBtn && flashIcon) {
      flashBtn.addEventListener('click', () => {
        flashIdx = (flashIdx + 1) % flashStates.length;
        flashIcon.textContent = flashStates[flashIdx];
      });
    }

    // Lens Toggle
    const lens05 = document.getElementById('lens-05');
    const lens1x = document.getElementById('lens-1x');

    if (lens05 && lens1x) {
      lens05.addEventListener('click', () => {
        lens05.classList.add('bg-surface', 'text-primary', 'neo-raised');
        lens05.classList.remove('text-on-surface-variant');
        lens1x.classList.remove('bg-surface', 'text-primary', 'neo-raised');
        lens1x.classList.add('text-on-surface-variant');
      });

      lens1x.addEventListener('click', () => {
        lens1x.classList.add('bg-surface', 'text-primary', 'neo-raised');
        lens1x.classList.remove('text-on-surface-variant');
        lens05.classList.remove('bg-surface', 'text-primary', 'neo-raised');
        lens05.classList.add('text-on-surface-variant');
      });
    }

    // Auto toggle
    const autoBtn = document.getElementById('auto-toggle');
    const toggleDot = document.getElementById('toggle-dot');
    let autoActive = true;

    if (autoBtn && toggleDot) {
      autoBtn.addEventListener('click', () => {
        autoActive = !autoActive;
        if (autoActive) {
          toggleDot.classList.add('translate-x-4');
          toggleDot.classList.remove('translate-x-0');
        } else {
          toggleDot.classList.remove('translate-x-4');
          toggleDot.classList.add('translate-x-0');
        }
      });
    }

    // Modal Draft Sheet Handlers
    const backBtn = document.getElementById('btn-back');
    const discardModal = document.getElementById('discard-modal');
    const modalKeep = document.getElementById('modal-keep');
    const modalDiscard = document.getElementById('modal-discard');

    if (backBtn && discardModal) {
      backBtn.addEventListener('click', () => {
        discardModal.classList.remove('hidden');
        discardModal.classList.add('flex');
      });

      if (modalKeep) {
        modalKeep.addEventListener('click', () => {
          discardModal.classList.add('hidden');
          discardModal.classList.remove('flex');
        });
      }

      if (modalDiscard) {
        modalDiscard.addEventListener('click', () => {
          discardModal.classList.add('hidden');
          discardModal.classList.remove('flex');
        });
      }
    }
  })();
</script></main></body></html>
