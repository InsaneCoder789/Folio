<script>
  // Simple interactive toggle for Snapping State
  const snapToggle = document.getElementById('snapToggle');
  const snapLabel = document.getElementById('snapLabel');
  const snapIcon = document.getElementById('snapIcon');
  let isSnapping = true;

  if (snapToggle) {
    snapToggle.addEventListener('click', () => {
      isSnapping = !isSnapping;
      if (isSnapping) {
        snapLabel.textContent = 'Snap: ON';
        snapLabel.className = 'text-[11px] font-label font-semibold text-primary';
        snapIcon.className = 'material-symbols-outlined text-[17px] text-primary';
      } else {
        snapLabel.textContent = 'Snap: OFF';
        snapLabel.className = 'text-[11px] font-label font-semibold text-on-surface-variant';
        snapIcon.className = 'material-symbols-outlined text-[17px] text-on-surface-variant';
      }
    });
  }
