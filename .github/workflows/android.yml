name: Android verification
on:
  push:
    branches: [main]
    paths: ['android/**', 'tools/verify_android.py', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'tools/verify_android.py', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0'
      - name: Build, test, lint and compile device tests
        run: python3 tools/verify_android.py
      - name: Build optimized unsigned release and app bundle
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease :app:bundleRelease :app:lintRelease
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-verification
          path: |
            output/android/verification.json
            output/android/build.log
            android/app/build/reports/tests/
            android/app/build/reports/lint-results-debug.*
            android/app/build/reports/lint-results-release.*
            android/app/build/outputs/mapping/release/
          retention-days: 7
